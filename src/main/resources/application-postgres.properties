# database init, supports postgres too
database=postgres
# Use Azure Managed Identity for authentication. Set the managed identity name via environment variable
# The username for Azure PostgreSQL should be the managed identity name
spring.datasource.username=${AZURE_MANAGED_IDENTITY_NAME:}
spring.cloud.azure.credential.managed-identity-enabled=true
spring.datasource.azure.passwordless-enabled=true
# JDBC URL for Azure PostgreSQL. Prefer setting via env var POSTGRES_URL; include sslmode=require for Azure.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://<your_server>.postgres.database.azure.com:5432/<your_database>?sslmode=require}
# NOTE: removed spring.datasource.password to enable passwordless managed identity authentication
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
