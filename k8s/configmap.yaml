apiVersion: v1
kind: ConfigMap
metadata:
  name: petclinic-config
  namespace: petclinic
data:
  # Set your Postgres JDBC URL; the deployment will reference this key as an env var
  POSTGRES_URL: "jdbc:postgresql://<your_server>.postgres.database.azure.com:5432/<your_database>?sslmode=require"
  # The managed identity name or client id used by the application to authenticate
  AZURE_MANAGED_IDENTITY_NAME: "<user-assigned-identity-name>"
